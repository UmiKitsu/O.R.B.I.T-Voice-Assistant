<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Orbit Browser Control</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
      body { width: 340px; margin: 0; background: #0f1720; color: #edf6ff; }
      main { padding: 18px; }
      h1 { margin: 0 0 12px; font-size: 18px; }
      p { margin: 8px 0; color: #b9c8d4; line-height: 1.4; overflow-wrap: anywhere; }
      #origin { padding: 10px; border-radius: 9px; background: #172431; color: #8ee8ff; }
      #status { padding: 10px; border-radius: 9px; background: #172431; min-height: 20px; }
      .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
      button { padding: 9px 12px; border: 0; border-radius: 9px; background: #67d5ff; color: #06202b; font-weight: 800; cursor: pointer; }
      button.secondary { background: #2d4354; color: #edf6ff; }
      button.danger { background: #ffb4ab; color: #3b0906; }
      button:disabled { opacity: .55; cursor: default; }
      small { display: block; margin-top: 10px; color: #90a4b4; }
    </style>
  </head>
  <body>
    <main>
      <h1>Orbit Browser Control</h1>
      <p id="origin">Reading current site…</p>
      <p id="permission">Checking site permission…</p>
      <div class="actions">
        <button id="grant">Grant this site</button>
        <button id="revoke" class="danger">Revoke this site</button>
      </div>
      <p id="status" role="status">Checking Orbit connection…</p>
      <div class="actions">
        <button id="retry" class="secondary">Retry connection</button>
        <button id="options" class="secondary">Pairing & diagnostics</button>
      </div>
      <small>Site access never permits passwords, payments, uploads, downloads, developer tools, arbitrary JavaScript, or unconfirmed consequential submissions.</small>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
